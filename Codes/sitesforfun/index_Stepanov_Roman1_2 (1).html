<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анализ выручки по штатам (топ 10)</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --container-bg: #fff;
      --text-color: #333;
      --table-header-bg: #0077cc;
      --table-header-text: #fff;
      --row-even-bg: #f9fbfc;
      --highlight-bg: #eaf4ff;
    }
    body.dark {
      --bg-color: #121212;
      --container-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --table-header-bg: #444;
      --table-header-text: #e0e0e0;
      --row-even-bg: #2a2a2a;
      --highlight-bg: #333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }
    .container {
      max-width: 900px;
      width: 100%;
      margin-top: 30px;
      background: var(--container-bg);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px 30px;
      transition: background-color 0.3s;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
    }
    select, input[type="file"], button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
      color: #333;
    }
    body.dark select, body.dark input[type="file"], body.dark button {
      background-color: #333;
      color: #e0e0e0;
      border: 1px solid #555;
    }
    #themeToggle:hover {
      background-color: #121212;
      color: #e0e0e0;
    }
    body.dark #themeToggle:hover {
      background-color: #f0f4f8;
      color: #333;
    }
    #showFullTableBtn:hover {
      background-color: var(--table-header-bg);
    }   

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
    }
    th {
      background-color: var(--table-header-bg);
      color: var(--table-header-text);
      padding: 12px 8px;
      text-align: center;
      font-weight: 600;
    }
    td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }
    tr:nth-child(even) {
      background-color: var(--row-even-bg);
    }
    #totalRevenue{
      margin-top: 20px;
      padding: 12px;
      background-color: var(--highlight-bg);
      border-radius: 6px;
      text-align: left;
      font-size: 18px;
      font-weight: bold;
    }
    #messageBox {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      width: 96.5%;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    #messageBox.error { background-color: rgba(255, 0, 0, 0.3); }
    #messageBox.warning { background-color: rgba(255, 255, 0, 0.3); }
    #messageBox.success { background-color: rgba(0, 255, 0, 0.3); }

    #fullTableContainer {
      display: none;
      margin-top: 30px;
    }

    #missingFieldsTable, #statsTable {
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: var(--table-header-bg);
      width: 100%;
      text-align: center;
    }
    #missingFieldsTable th, #statsTable th{
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    #missingFieldsTable tr, #statsTable tr{
      background-color: var(--bg-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="mainHeader">Анализ выручки по штатам (топ 10)</h2>

    <div class="controls">
      <input type="file" id="fileInput" accept=".csv">
      <label for="yearSelect">Выберите год:</label>
      <select id="yearSelect"></select>
      <button id="themeToggle">Тёмная тема</button>
      <button id="showFullTableBtn">Посмотреть полную таблицу</button>
    </div>

    <div id="messageBox"></div>

    <table id="resultTable">
      <thead>
        <tr>
          <th>№</th>
          <th>Штат</th>
          <th>Количество заказов</th>
          <th>Выручка ($)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="totalRevenue">
      <p>Общая выручка за год: $0.00</p>
      <p>Выручка топ 10 за год: $0.00</p>
      <p>Доля топ 10 за год: 0.00%</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const yearSelect = document.getElementById('yearSelect');
    const tableBody = document.querySelector('#resultTable tbody');
    const totalRevenueDiv = document.getElementById('totalRevenue');
    const themeToggle = document.getElementById('themeToggle');
    const messageBox = document.getElementById('messageBox');
    const showFullTableBtn = document.getElementById('showFullTableBtn');
    const mainHeader = document.getElementById('mainHeader');
    let showFullTable = false;

    let data = [];

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      themeToggle.textContent = document.body.classList.contains('dark') ? 'Светлая тема' : 'Тёмная тема';
    });

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        dynamicTyping: true,
        complete: function(results) {
          const requiredFields = ['order_date', 'sales', 'state'];
          const headers = results.meta.fields || [];
          const checkFields = ['name', 'segment', 'state', 'city', 'order_date', 'ship_mode', 'sales']
          const missingFields = checkFields.filter(f => !headers.includes(f));

          if (missingFields.length > 0) {
            showMessage('error', 'Ошибка: Файл .csv не содержит необходимых полей');
            renderMissingFields(missingFields);
            return;
          }

          const totalRows = results.data.length;
          const validData = [];
          let invalidCount = 0;
          let invalidSales = 0;
          let missingValues = 0;

          results.data.forEach(row => {
            if (row.order_date && row.sales && row.state && !isNaN(Date.parse(row.order_date)) && typeof row.sales === 'number' && row.name && row.segment && row.city && row.ship_mode && row.sales > 0 && row.sales < 100000) {
              validData.push(row);
            } else {
              invalidCount++;
              if (typeof row.sales === 'number' && (row.sales <= 0 || row.sales >= 100000))
              {
                invalidSales++;
              }
              if (!(row.order_date && row.sales && row.state && row.name && row.segment && row.city && row.ship_mode && !isNaN(Date.parse(row.order_date))))
              {
                missingValues++;
              }
            }
          });

          data = validData;

          if (invalidCount > 0 && validData.length > 0) {
            showMessage('warning', 'Внимание: Данные загружены с предупреждениями, некоторые строки исключены');
            renderStats(totalRows, validData.length, invalidCount, invalidSales, missingValues);
          } else if (invalidCount === 0 && validData.length > 0) {
            showMessage('success', 'Данные загружены и проверены');
            renderStats(totalRows, validData.length, invalidCount, invalidSales, missingValues);
          } else {
            showMessage('error', 'Ошибка: Файл не содержит корректных данных для анализа');
            return;
          }

          populateYears();
        }
      });
    });

    function showMessage(type, text) {
      messageBox.className = '';
      messageBox.classList.add(type);
      messageBox.textContent = text;
      messageBox.style.display = 'block';
    }

    function renderMissingFields(fields) {
      const table = document.createElement('table');
      table.id = 'missingFieldsTable';
      table.innerHTML = `<thead><tr><th>Отсутствующие поля</th></tr></thead><tbody>${fields.map(f => `<tr><td>${f}</td></tr>`).join('')}</tbody>`;
      messageBox.appendChild(table);
    }

    function renderStats(total, valid, invalid, invSales, missVal) {
      const table = document.createElement('table');
      table.id = 'statsTable';
      table.innerHTML = `<thead><tr><th>Статистика загрузки</th><th>Количество строк</th></tr></thead>
        <tbody>
          <tr><td>Всего строк</td><td>${total}</td></tr>
          <tr><td>Корректных строк</td><td>${valid}</td></tr>
          <tr><td>Строк с пустыми значениями</td><td>${missVal}</td></tr>
          <tr><td>Выброс в продажах</td><td>${invSales}</td></tr>
          <tr><td>Отброшенных строк</td><td>${invalid}</td></tr>
        </tbody>`;
      messageBox.appendChild(table);
    }

    function populateYears() {
      const years = [...new Set(data.map(row => new Date(row.order_date).getFullYear()))];
      yearSelect.innerHTML = years.sort().map(y => `<option value="${y}">${y}</option>`).join('');
      showTable(years[0]);
    }

    yearSelect.addEventListener('change', () => showTable(yearSelect.value));

    function showTable(year) {
      const filtered = data.filter(row => new Date(row.order_date).getFullYear() == year);
      const grouped = {};
      let totalRevenue = 0;
      let top10Revenue = 0;

      filtered.forEach(row => {
        if (!grouped[row.state]) {
          grouped[row.state] = { revenue: 0, orders: 0 };
        }
        grouped[row.state].revenue += row.sales;
        grouped[row.state].orders += 1;
        totalRevenue += row.sales;
      });

      const allStates = Object.entries(grouped)
        .map(([state, vals]) => ({ state, revenue: vals.revenue, orders: vals.orders }))
        .sort((a, b) => b.revenue - a.revenue);

      const top10 = allStates.slice(0, 10);
      top10.forEach(r => top10Revenue += r.revenue);

      tableBody.innerHTML = (showFullTable ? allStates : top10).map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${r.state}</td>
          <td>${r.orders}</td>
          <td>$${r.revenue.toFixed(2)}</td>
        </tr>
       `).join('');
      
      const formatter=new Intl.NumberFormat('en-US', {
        style: 'decimal',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      totalRevenueDiv.innerHTML= `<p>Общая выручка за ${year} год: $${formatter.format(totalRevenue)}</p>
      <p>Выручка топ 10 за ${year} год: $${formatter.format(top10Revenue)}</p>
      <p>Доля топ 10 за ${year} год: ${formatter.format(isNaN((top10Revenue*100)/totalRevenue) ? 0.0 : (top10Revenue*100)/totalRevenue)}%</p>`;
    }
    function renderMainHeader(){
      mainHeader.innerText = showFullTable ? 'Анализ выручки по всем штатам' : 'Анализ выручки по штатам (топ 10)';
    }

    showFullTableBtn.addEventListener('click', () => {
      showFullTable = !showFullTable;
      showFullTableBtn.textContent = showFullTable ? 'Скрыть полную таблицу' : 'Посмотреть полную таблицу';
      showTable(yearSelect.value);
      renderMainHeader();
    });
  </script>
</body>
</html>
